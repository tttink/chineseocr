<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js Scene</title>
  <style>
    :root { --bg: #0e1116; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; touch-action: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const container = document.getElementById('app');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Scene, fog matched to background for depth
    const bg = new THREE.Color('#0e1116');
    const scene = new THREE.Scene();
    scene.background = bg;
    scene.fog = new THREE.Fog(bg, 8, 22);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.6;

    // Camera + controls
    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(6, 4, 8);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.8, 0);
    controls.maxPolarAngle = Math.PI * 0.49;

    // Key light with shadows
    const key = new THREE.DirectionalLight('#ffffff', 2.2);
    key.position.set(4, 8, 3);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.radius = 4; // soften PCF edges
    Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 20 });
    scene.add(key);

    // Rim light behind the subject
    const rim = new THREE.PointLight('#ff6a3d', 40, 0, 2);
    rim.position.set(-3, 3, -4);
    scene.add(rim);

    // Ground: shadow catcher only
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.ShadowMaterial({ opacity: 0.35 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Hero object
    const hero = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.8, 0.28, 220, 32),
      new THREE.MeshPhysicalMaterial({ color: '#e8e4dc', roughness: 0.25, metalness: 0.1, clearcoat: 1 })
    );
    hero.position.y = 1.6;
    hero.castShadow = true;
    scene.add(hero);

    // Instanced ring of small cubes (one draw call)
    const COUNT = 240;
    const cubes = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.12, 0.12, 0.12),
      new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.2 }),
      COUNT
    );
    cubes.castShadow = true;
    const dummy = new THREE.Object3D();
    const color = new THREE.Color();
    const seeds = Float32Array.from({ length: COUNT }, () => Math.random());
    for (let i = 0; i < COUNT; i++) {
      cubes.setColorAt(i, color.setHSL(0.03 + seeds[i] * 0.08, 0.75, 0.55));
    }
    scene.add(cubes);

    function layoutCubes(t) {
      for (let i = 0; i < COUNT; i++) {
        const a = (i / COUNT) * Math.PI * 2 + t * 0.15;
        const r = 2.6 + Math.sin(i * 0.7 + t) * 0.15;
        dummy.position.set(Math.cos(a) * r, 0.4 + Math.sin(a * 3 + t * 0.8) * 0.25 + seeds[i] * 0.3, Math.sin(a) * r);
        dummy.rotation.set(t + i, t * 0.5 + i, 0);
        dummy.updateMatrix();
        cubes.setMatrixAt(i, dummy.matrix);
      }
      cubes.instanceMatrix.needsUpdate = true;
    }
    layoutCubes(0);

    // Loop
    const timer = new THREE.Timer();
    timer.connect(document);
    renderer.setAnimationLoop((time) => {
      timer.update(time);
      const t = reduceMotion ? 0 : timer.getElapsed();
      hero.rotation.set(t * 0.2, t * 0.3, 0);
      layoutCubes(t);
      controls.update();
      renderer.render(scene, camera);
    });

    // Resize from the container so the scene also works when embedded
    new ResizeObserver(() => {
      const w = container.clientWidth, h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }).observe(container);
  </script>
</body>
</html>
